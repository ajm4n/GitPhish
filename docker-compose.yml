version: '3.3'

services:
  gitphish:
    build: .
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      # Mount data directory for persistent SQLite database
      - ./data:/app/data
      # Mount token directory for persistent tokens
      - ./tokens:/app/tokens
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=development
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8080
    restart: unless-stopped
    # Optional: Add health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3